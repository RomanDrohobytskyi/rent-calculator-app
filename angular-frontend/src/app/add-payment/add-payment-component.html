<div class="col-md-6 offset-md-3">
  <h3 class="text-center">Add new payment</h3>
  <form (ngSubmit)="onSubmit()">

    <div *ngFor="let utilityBill of payment.utilityBills">
      <div class="form-group">
        <label>{{ utilityBill.utilityType }}</label>
        <input type="number" class="form-control" [(ngModel)]="utilityBill.meterState" name="{{utilityBill.utilityType}}">
      </div>
    </div>

    <div class="form-group">
      <label>Payment Date</label>
      <input type="date" class="form-control" id="paymentDate" [(ngModel)]="payment.paymentDate" name="paymentDate">
    </div>

    <button class="btn btn-success" type="submit">Add</button>

  </form>
</div>
