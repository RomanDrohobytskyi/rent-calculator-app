<h3>Payment details</h3>

<table class="table table-striped">
  <tbody>
  <tr>
    <td>
      <div>
        <label><b>ID</b></label> {{ payment.id }}
      </div>
      <div>
        <label><b>Utility bills</b></label>
        <ul class="utility-bills">
          <li *ngFor="let utilityBill of payment.utilityBills">
            <strong>{{ utilityBill.utilityType }} </strong> <br>
            State: {{ utilityBill.meterState }} <br>
            Consumption: {{ utilityBill.consumption }} <br>
            Cost: {{ utilityBill.cost }}
          </li>
        </ul>
      </div>
      <div>
        <label><b>Total</b></label> {{ payment.total }}
      </div>
    </td>

    <td>
      <div>
        <label><b>Creation Date</b></label> {{ payment.creationDate }}
      </div>
      <div>
        <label><b>Payment Date</b></label> {{ payment.paymentDate }}
      </div>
    </td>

    <td>
      <div style="max-width: 40%;">
        <label><b>Message</b></label> {{ payment.emailMessage }}
      </div>
    </td>
  </tr>
  </tbody>
</table>

<div>


</div>
